<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>洗車機スタンドマップ</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { width: 100vw; height: 100vh; }
        /* 操作パネルのスタイル */
        .panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 10px; border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3); font-size: 14px;
            display: flex; flex-direction: column; gap: 6px;
        }
        button { background: #007bff; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:active { background: #0056b3; }
        button:disabled { cursor: wait; opacity: 0.65; }
        /* ローディング表示 */
        #loading {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: rgba(0, 0, 0, 0.7); color: white;
            padding: 6px 14px; border-radius: 20px; font-size: 13px; display: none;
        }
        #disclaimer { max-width: 240px; font-size: 12px; line-height: 1.5; }
        .current-location-marker { filter: hue-rotate(150deg) saturate(2); }
    </style>
</head>
<body>

    <div id="loading">洗車場データを読み込み中...</div>

    <div class="panel">
        <button onclick="panToCurrentLocation()">📍 現在地に移動</button>
        <button id="refresh-button" type="button" onclick="loadCarWashStations()" style="background: #28a745;">🔄 データ更新</button>
        <div id="disclaimer">
            掲載情報は参考情報です。営業時間・車両制限等は現地でご確認ください。
            掲載情報の利用による損害について、当サイトは責任を負いかねます。
        </div>
    </div>
    
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. 地図の初期化（東京駅近辺を初期中心に設定）
        const map = L.map('map').setView([35.6812, 139.7671], 13);

        // OpenStreetMapのタイルレイヤー（無料）
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // マーカーを格納するレイヤーグループ（データ更新時にリセットするため）
        const markersLayer = L.layerGroup().addTo(map);

        // 2. ご提示いただいたGASのウェブアプリURL
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxrhpIheumH2JUaDLTRhXGkXvnRw-veky7mYEliqtqkMclSddWSeyvuyEbnkzpw5AB6/exec";

        // 3. スプレッドシートからデータを取得してマップにプロットする関数
        let isLoadingStations = false;

        function parseCoordinate(value, min, max) {
            if (typeof value !== 'number' && typeof value !== 'string') return null;
            if (typeof value === 'string' && value.trim() === '') return null;

            const coordinate = Number(value);
            return Number.isFinite(coordinate) && coordinate >= min && coordinate <= max
                ? coordinate
                : null;
        }

        function displayValue(value, fallback) {
            if (value === null || value === undefined) return fallback;
            const text = String(value).trim();
            return text || fallback;
        }

        function createStationPopup(station, lat, lng) {
            const popup = document.createElement('div');
            popup.style.minWidth = '160px';

            const name = document.createElement('b');
            name.textContent = displayValue(station.name, '名称未設定');
            popup.append(name, document.createElement('br'));

            const type = document.createElement('span');
            type.style.cssText = 'color:#555;font-size:12px;';
            type.textContent = `タイプ: ${displayValue(station.type, '-')}`;
            popup.append(type, document.createElement('br'));

            const hours = document.createElement('span');
            hours.style.cssText = 'color:#555;font-size:12px;';
            hours.textContent = `営業時間: ${displayValue(station.time, '-')}`;
            popup.append(hours, document.createElement('br'), document.createElement('br'));

            const mapsUrl = new URL('https://www.google.com/maps/dir/');
            mapsUrl.searchParams.set('api', '1');
            mapsUrl.searchParams.set('destination', `${lat},${lng}`);

            const link = document.createElement('a');
            link.href = mapsUrl.toString();
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.style.cssText = 'display:block;text-align:center;background:#34a853;color:white;padding:6px 10px;text-decoration:none;border-radius:4px;font-weight:bold;font-size:13px;';
            link.textContent = '🚗 Googleマップで案内';
            popup.append(link);

            return popup;
        }

        async function loadCarWashStations() {
            if (isLoadingStations) return;

            isLoadingStations = true;
            const loadingEl = document.getElementById('loading');
            const refreshButton = document.getElementById('refresh-button');
            loadingEl.style.display = 'block';
            refreshButton.disabled = true;

            try {
                const response = await fetch(GAS_URL);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const stations = await response.json();
                if (!Array.isArray(stations) || stations.some(station => station && station.error)) {
                    throw new Error('Invalid station data');
                }

                markersLayer.clearLayers();
                stations.forEach(station => {
                    if (!station || typeof station !== 'object') return;

                    const lat = parseCoordinate(station.lat, -90, 90);
                    const lng = parseCoordinate(station.lng, -180, 180);
                    if (lat === null || lng === null) return;

                    L.marker([lat, lng]).addTo(markersLayer)
                        .bindPopup(createStationPopup(station, lat, lng));
                });
            } catch (error) {
                console.error('データ取得エラー:', error);
                alert('洗車場データの取得に失敗しました。');
            } finally {
                loadingEl.style.display = 'none';
                refreshButton.disabled = false;
                isLoadingStations = false;
            }
        }

        // 4. ユーザーの現在地取得とプロット機能
        let userMarker = null;
        let userCircle = null;

        function panToCurrentLocation() {
            if (!navigator.geolocation) {
                alert("お使いのブラウザは位置情報に対応していません。");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const accuracy = position.coords.accuracy;

                    if (userMarker) {
                        userMarker.setLatLng([lat, lng]);
                        userCircle.setLatLng([lat, lng]);
                        userCircle.setRadius(accuracy);
                    } else {
                        userMarker = L.marker([lat, lng], {
                            title: "現在地",
                            icon: new L.Icon.Default({
                                className: 'current-location-marker'
                            })
                        }).addTo(map).bindPopup("いまここ（あなた）");

                        userCircle = L.circle([lat, lng], {
                            radius: accuracy,
                            color: '#cc1818',
                            fillColor: '#cc1818',
                            fillOpacity: 0.15
                        }).addTo(map);
                    }

                    map.setView([lat, lng], 15);
                },
                (error) => {
                    alert("位置情報の取得に失敗しました。ブラウザの位置情報権限をご確認ください。");
                },
                { enableHighAccuracy: true }
            );
        }

        // ページ読み込み時に自動でスプレッドシートのデータを取得して表示
        window.addEventListener('load', () => {
            loadCarWashStations();
        });
    </script>
</body>
</html>
